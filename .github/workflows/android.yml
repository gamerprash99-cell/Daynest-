name: Android CI

# Triggers:
# - Every push to main or master
# - Every pull request (so you see build status before merging)
# - Manual runs from the Actions tab ("Run workflow" button)
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

# If you push again before a previous run finishes, cancel the stale one
# instead of wasting runner time on an outdated commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This project uses Kotlin 2.1.0 / AGP 8.13.0, which require JDK 17
      # to run the Gradle build itself (separate from the app's own Java 17
      # bytecode target, which is set in app/build.gradle.kts).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Confirms gradlew / gradle-wrapper.jar haven't been tampered with,
      # and installs the exact Android SDK platform + build-tools the
      # project needs, accepting the SDK licenses automatically so the
      # build never stalls waiting for interactive confirmation.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Caches the Gradle wrapper distribution and dependency downloads
      # between runs, and validates the wrapper's checksum for security.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK was produced
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected APK not found at $APK_PATH"
            exit 1
          fi
          echo "Found $(du -h "$APK_PATH" | cut -f1) APK at $APK_PATH"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Daynest-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Uploaded even on failure so a build break is easy to diagnose from
      # the Actions tab without needing to reproduce it locally.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
